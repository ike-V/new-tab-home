<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<link rel="icon" href="icons/icon48.png">
<style>
  :root{
    --glass-bg: rgba(20,20,20,0.35);
    --glass-border: rgba(255,255,255,0.18);
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.75);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden;
    color: var(--text);
  }
  #bg{
    position:fixed; inset:0;
    background-size:cover;
    background-position:center;
    background-color:#1a1a1a;
    transition: background-image 0.6s ease-in-out;
    z-index:-2;
  }
  #bg::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.35));
    z-index:-1;
  }
  #bg-fallback-note{
    position:fixed; bottom:16px; left:16px;
    font-size:12px; color:var(--text-dim);
    max-width:260px; line-height:1.4;
    background:var(--glass-bg); backdrop-filter: blur(10px);
    padding:8px 12px; border-radius:10px;
    border:1px solid var(--glass-border);
    display:none;
  }

  .center{
    height:100%; width:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:28px;
  }

  #clock{
    font-size:64px; font-weight:700;
    text-shadow:0 2px rgba(0,0,0,0.35);
    letter-spacing:1px;
    line-height:1;
    text-align: center;
  }
  #date{
    margin-top:0px;
    font-size:16px; font-weight:400;
    color: var(--text-dim);
    text-shadow:0 1px 10px rgba(0,0,0,0.35);
    text-align: center;
  }

  form#search-form{
    width:min(560px, 86vw);
    position:relative;
  }
  #search{
    width:100%;
    padding:16px 22px;
    font-size:16px;
    border-radius:999px;
    border:1px solid var(--glass-border);
    background:var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color:var(--text);
    outline:none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }
  #search::placeholder{ color: var(--text-dim); }
  #search:focus{ border-color: rgba(255,255,255,0.4); }

  .engine-toggle{
    position:absolute; top:50%; right:8px; transform:translateY(-50%);
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--glass-border); background:rgba(255,255,255,0.08);
    cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  .engine-toggle img{ width:18px; height:18px; border-radius:4px; }
  .engine-menu{
    position:absolute; top:calc(100% + 8px); right:0;
    width:200px;
    max-height:min(320px, 60vh);
    overflow-y:auto;
    scrollbar-width:none;
    background:var(--glass-bg); backdrop-filter: blur(16px);
    border:1px solid var(--glass-border); border-radius:14px;
    padding:6px; display:none; flex-direction:column; gap:2px;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    z-index:5;
  }
  .engine-menu::-webkit-scrollbar{ display:none; }
  .engine-menu.open{ display:flex; }
  .engine-menu.flip-up{ top:auto; bottom:calc(100% + 8px); }
  .engine-menu button{
    display:flex; align-items:center; gap:10px;
    padding:8px 10px; border-radius:8px; border:none; background:none;
    color:var(--text); font-size:13px; text-align:left; cursor:pointer;
  }
  .engine-menu button:hover{ background:rgba(255,255,255,0.12); }
  .engine-menu img{ width:18px; height:18px; border-radius:4px; }

  #toolbar{
    position:fixed; top:16px; right:16px;
    display:flex; gap:8px;
  }
  .tool-btn{
    width:36px; height:36px; border-radius:50%;
    background:var(--glass-bg); backdrop-filter: blur(12px);
    border:1px solid var(--glass-border);
    color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    padding:0;
    appearance:none; -webkit-appearance:none;
    font-family:inherit;
  }
  .tool-btn:hover{ background:rgba(255,255,255,0.2); }

  #drop-hint{
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,0.5); z-index:10;
    font-size:22px; color:#fff; pointer-events:none;
  }
  #drop-hint.show{ display:flex; }
</style>
</head>
<body>

<div id="bg"></div>
<div id="bg-fallback-note">No wallpaper folder connected yet. Click the ⛭ button (top right) to choose one, or drag & drop images anywhere on this page.</div>

<div class="center">
  <div>
    <div id="clock">--:--</div>
    <div id="date">-</div>
  </div>

  <div>
    <form id="search-form">
      <input id="search" type="text" placeholder="Search the web…" autofocus autocomplete="off">
      <button type="button" id="engine-toggle" class="engine-toggle" title="Choose search engine"></button>
      <div id="engine-menu" class="engine-menu"></div>
    </form>
  </div>

</div>

<div id="toolbar">
 <button type="button" class="tool-btn" id="wallpaper-btn" title="Wallpaper settings">⛭</button>
</div>

<div id="drop-hint">Drop images to add them as wallpapers</div>
<input type="file" id="wallpaper-input" accept="image/*" multiple hidden>

<!-- Extension pages block inline scripts (MV3 CSP): keep all JS in app.js. -->
<script src="app.js"></script>
</body>
</html>
