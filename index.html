<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<link rel="icon" href="icons/icon48.png">
<style>
  /* ----- colours and sizes ----- */
  :root{
    --engine-icon:23.4px;
    --glass-bg: rgba(20,20,20,0.35);
    --glass-border: rgba(255,255,255,0.18);
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.75);
  }
  /* ----- page basics ----- */
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden;
    color: var(--text);
  }
  /* ----- wallpaper layer ----- */
  #bg{
    position:fixed; inset:0;
    background-size:cover;
    background-position:center;
    background-color:#1a1a1a;
    transition: background-image 0.6s ease-in-out;
    z-index:-2;
  }
  #bg::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.35));
    z-index:-1;
  }
  /* ----- bottom-left note ----- */
  #bg-fallback-note{
    position:fixed; bottom:14px; left:14px;
    font-size:11px; color:var(--text-dim);
    max-width:234px; line-height:1.4;
    background:var(--glass-bg); backdrop-filter: blur(10px);
    padding:7px 11px; border-radius:9px;
    border:1px solid var(--glass-border);
    display:none;
  }
  #note-action{
    display:block; margin-top:7px; padding:5px 11px;
    border-radius:999px; border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.12); color:var(--text);
    font:inherit; cursor:pointer;
  }
  #note-action:hover{ background:rgba(255,255,255,0.2); }
  #note-action[hidden]{ display:none; }

  /* ----- centred column ----- */
  .center{
    height:100%; width:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:12px;
  }

  /* ----- clock ----- */
  #clock{
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:80px; font-weight:700;
    -webkit-text-stroke:4px #000; paint-order:stroke fill;
    letter-spacing:.9px;
    line-height:1; margin-bottom:-2px;
    text-align: center;
  }
  /* ----- date ----- */
  #date{
    margin-top:0px;
    font-size:16px; font-weight:400;
    color:#e6e6e6;
    -webkit-text-stroke:2px #000; paint-order:stroke fill;
    text-align: center;
  }

  /* ----- search bar ----- */
  #search-wrap{
    width:min(504px, 86vw);
    position:relative;
  }
  #search{
    width:100%;
    padding:14px 20px;
    font-size:14.4px;
    border-radius:999px;
    border:1px solid var(--glass-border);
    background:var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color:var(--text);
    outline:none;
    -webkit-text-stroke:1.8px #000; paint-order:stroke fill;
    box-shadow: 0 0 0 1px #000, 0 7px 27px rgba(0,0,0,0.25);
  }
  #search::placeholder{ color:#d8d8d8; -webkit-text-stroke:1.8px #000; paint-order:stroke fill; }
  #search:focus{ border-color: rgba(255,255,255,0.4); }

  /* ----- search bar magnifier circle ----- */
  .engine-toggle{
    position:absolute; top:50%; right:7px; transform:translateY(-50%);
    width:31px; height:31px; border-radius:50%;
    border:1px solid var(--glass-border); background:var(--glass-bg);
    box-shadow:0 0 0 1px #000;
    cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  .engine-toggle img{ width:16px; height:16px; }
  /* ----- engine menu panel ----- */
  .engine-menu{
    position:absolute; top:calc(100% + 7px); right:0;
    width:min(234px, 86vw);
    max-height:min(288px, 60vh);
    overflow-y:auto;
    scrollbar-width:none;
    background:var(--glass-bg); backdrop-filter: blur(16px);
    border:1px solid var(--glass-border); border-radius:13px;
    padding:5px; display:none; flex-direction:column; gap:2px;
    box-shadow:0 0 0 1px #000, 0 9px 36px rgba(0,0,0,0.4);
    z-index:5;
  }
  .engine-menu::-webkit-scrollbar{ display:none; }
  .engine-menu.open{ display:flex; }
  .engine-menu.flip-up{ top:auto; bottom:calc(100% + 7px); }
  /* ----- engine menu rows ----- */
  .engine-menu button{
    display:flex; align-items:center; gap:9px;
    padding:7px 9px; border-radius:7px; border:none; background:none;
    color:var(--text); font-size:11.7px; text-align:left; cursor:pointer;
    -webkit-text-stroke:2px #000; paint-order:stroke fill;
  }
  .engine-menu button:hover{ background:rgba(255,255,255,0.12); }
  /* ----- engine menu icon plates ----- */
  .engine-menu img{
    width:calc(var(--engine-icon) + 11px); height:calc(var(--engine-icon) + 11px); padding:4.5px; flex:none;
    border-radius:9px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.22);
    box-shadow:0 0 0 1px #000;
  }
  .ef-iconrow{ display:flex; align-items:center; gap:9px; }
  .engine-menu [hidden]{ display:none; }
  /* ----- wallpaper buttons under the gear ----- */
  #wallpaper-menu{
    width:auto; flex-direction:column; gap:7px; padding:0; max-height:none; overflow:visible;
    background:none; border:0; box-shadow:none; backdrop-filter:none;
  }
  #wallpaper-menu button{
    width:32px; height:32px; padding:0; justify-content:center; border-radius:50%;
    background:var(--glass-bg); border:1px solid var(--glass-border); box-shadow:0 0 0 1px #000;
    backdrop-filter:blur(12px);
  }
  #wallpaper-menu button:hover{ background:rgba(255,255,255,0.12); }
  #wallpaper-menu .slash{ display:none; }
  #wallpaper-menu button.off .slash{ display:inline; }
  /* ----- hidden clock and search bar ----- */
  .hide-clock #clock-block, .hide-search #search-block{ display:none; }
  /* ----- engine menu rows, remove button ----- */
  .engine-menu .engine-remove img{ width:14px; height:14px; padding:0; border:0; border-radius:0; background:none; box-shadow:none; image-rendering:pixelated; }
  .engine-row{ display:flex; align-items:center; border-radius:7px; }
  .engine-row.active{ background:rgba(255,255,255,0.08); }
  .engine-menu .engine-pick{ flex:1; min-width:0; padding:4px 9px 4px 4px; }
  .engine-menu .engine-pick span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .engine-menu .engine-remove{ padding:5px 9px; font-size:14px; line-height:1; color:var(--text-dim); }
  .engine-menu .engine-add{ color:var(--text-dim); padding-left:4px; }
  /* ----- add-engine form ----- */
  .engine-form{ display:flex; flex-direction:column; gap:5px; padding:4px; }
  .engine-form input{
    width:100%; padding:7px 9px; border-radius:7px;
    border:1px solid var(--glass-border); background:rgba(255,255,255,0.08);
    color:var(--text); font-size:11.7px; outline:none;
  }
  .engine-form input::placeholder{ color:var(--text-dim); }
  .engine-form input:focus{ border-color:rgba(255,255,255,0.4); }
  .engine-form .ef-error{ font-size:11px; line-height:1.3; color:#ff9b9b; }
  .engine-form .ef-error:empty{ display:none; }
  .engine-form .ef-actions{ display:flex; gap:5px; justify-content:flex-end; }
  .engine-menu .ef-save{ background:rgba(255,255,255,0.16); }

  /* ----- gear button ----- */
  #toolbar{
    position:fixed; top:14px; right:14px;
    display:flex; gap:7px;
  }
  .tool-btn{
    width:32px; height:32px; border-radius:50%;
    background:var(--glass-bg); backdrop-filter: blur(12px);
    border:1px solid var(--glass-border);
    box-shadow:0 0 0 1px #000;
    color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    padding:0;
    appearance:none; -webkit-appearance:none;
    font-family:inherit;
  }
  .tool-btn svg, #wallpaper-menu svg{ overflow:visible; }
  .tool-btn:hover{ background:rgba(255,255,255,0.12); }

  /* ----- drop hint ----- */
  #drop-hint{
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,0.5); z-index:10;
    font-size:20px; color:#fff; pointer-events:none;
  }
  #drop-hint.show{ display:flex; }
</style>
</head>
<body>

<!-- wallpaper layer -->
<div id="bg"></div>
<!-- bottom-left note -->
<div id="bg-fallback-note"><span id="note-text"></span><button type="button" id="note-action" hidden></button></div>

<!-- centred column -->
<div class="center">
  <!-- clock and date -->
  <div id="clock-block">
    <div id="clock">--:--</div>
    <div id="date">-</div>
  </div>

  <!-- search bar and engine menu -->
  <div id="search-block">
    <div id="search-wrap">
      <form id="search-form">
        <input id="search" type="text" placeholder="Search the web…" autofocus autocomplete="off">
      </form>
      <button type="button" id="engine-toggle" class="engine-toggle" title="Choose search engine"></button>
      <div id="engine-menu" class="engine-menu"></div>
    </div>
  </div>

</div>

<!-- gear button and wallpaper buttons -->
<div id="toolbar">
 <button type="button" class="tool-btn" id="wallpaper-btn" title="Wallpaper settings" aria-label="Wallpaper settings"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g stroke="#000" stroke-width="4.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></g><g stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></g></svg></button>
 <div id="wallpaper-menu" class="engine-menu">
  <button type="button" id="wp-add" title="Add images" aria-label="Add images"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g stroke="#000" stroke-width="4.7"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/></g><g stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/></g></svg></button>
  <button type="button" id="wp-next" title="Show another" aria-label="Show another"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g stroke="#000" stroke-width="4.7"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></g><g stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></g></svg></button>

  <button type="button" id="wp-clock" title="Hide clock" aria-label="Hide clock"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g stroke="#000" stroke-width="4.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/><path class="slash" d="M3 3l18 18"/></g><g stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/><path class="slash" d="M3 3l18 18"/></g></svg></button>
  <button type="button" id="wp-search" title="Hide search bar" aria-label="Hide search bar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g stroke="#000" stroke-width="4.7"><circle cx="11" cy="10.5" r="6.5"/><path d="M16 15.5l4.5 4.5"/><path class="slash" d="M3 3l18 18"/></g><g stroke="currentColor" stroke-width="2"><circle cx="11" cy="10.5" r="6.5"/><path d="M16 15.5l4.5 4.5"/><path class="slash" d="M3 3l18 18"/></g></svg></button>
 </div>
</div>

<!-- drop hint -->
<div id="drop-hint">Drop images to add them as wallpapers</div>
<!-- hidden file chooser -->
<input type="file" id="wallpaper-input" accept="image/*" multiple hidden>

<!-- Extension pages block inline scripts (MV3 CSP): keep all JS in app.js. -->
<script src="app.js"></script>
</body>
</html>
